name: Unsigned IPA (for SideStore / iloader)

# Run by hand (Actions › Unsigned IPA › Run workflow). Builds the app without signing; SideStore or iloader
# signs it with your own Apple ID when it installs it. Download the "ipa" artifact from the run page.
on:
  workflow_dispatch:
  push:
    branches: [remote-tasks]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Archive (unsigned, device)
        run: |
          xcodebuild archive -scheme IPhoneAgent -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IA_BUNDLE_ID=com.example.phoneagent IA_APP_NAME="Phone Agent"
      - name: Package IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qry PhoneAgent-unsigned.ipa Payload
          ls -la PhoneAgent-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/PhoneAgent-unsigned.ipa
          retention-days: 7
